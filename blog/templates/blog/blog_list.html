{% extends "base.html" %}

{% block title %}
Blog
{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-5 text-center">
        Latest Articles
    </h1>

    <div class="row">

        {% for blog in blogs %}

        <div class="col-lg-4 mb-4">

            <div class="card shadow h-100">

                {% if blog.featured_image %}

                <img src="{{ blog.featured_image.url }}"
                     class="card-img-top">

                {% endif %}

                <div class="card-body">

                    <h3>
                        {{ blog.title }}
                    </h3>

                    <p>
                        {{ blog.summary|truncatewords:25 }}
                    </p>

                    <a href="{% url 'blog:blog_detail' blog.slug %}"
                       class="btn btn-primary">

                        Read More

                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="alert alert-info">
            No blog posts available.
        </div>

        {% endfor %}

    </div>
</div>

{% endblock %}
