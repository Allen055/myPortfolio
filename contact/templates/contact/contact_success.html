{% extends "base.html" %}

{% block title %}Message Sent{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card border-0 shadow-lg p-5 rounded-4">
        <div class="mb-3 text-success fs-1">✓</div>
        <h2 class="fw-bold mb-2">Thank You!</h2>
        <p class="text-muted mb-4">Your message has been received. I will get back to you soon.</p>
        <div>
          <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2 rounded-3 fw-semibold">
            Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
