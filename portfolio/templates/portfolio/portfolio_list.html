{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>My Projects</h2>

        <a href="{% url 'portfolio:portfolio_create' %}"
           class="btn btn-primary">
            Add Project
        </a>

    </div>

    <div class="row">

        {% for project in projects %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                {% if project.image %}
                <img src="{{ project.image.url }}"
                     class="card-img-top">
                {% endif %}

                <div class="card-body">

                    <h4>{{ project.title }}</h4>

                    <p>{{ project.short_description }}</p>

                    <a href="{% url 'portfolio:portfolio_detail' project.pk %}"
                       class="btn btn-outline-primary">
                        View Details
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <p>No projects available.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
