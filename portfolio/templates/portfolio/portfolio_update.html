{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Project</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-warning">
            Update Project
        </button>

        <a href="{% url 'portfolio:portfolio_detail' project.pk %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
