{% extends "base.html" %}

{% block title %}Delete Skill{% endblock %}

{% block content %}

<div class="container py-5 text-center">

<h2>

Delete "{{ skill.name }}"?

</h2>

<form method="POST">

{% csrf_token %}

<button class="btn btn-danger">

Delete

</button>

<a href="{% url 'skill_list' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
