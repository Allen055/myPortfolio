{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <h3 class="fw-bold text-center mb-4">Change Password</h3>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary small">
                                {{ field.label }}
                            </label>
                            <input type="{{ field.field.widget.input_type }}" 
                                   name="{{ field.name }}" 
                                   id="{{ field.id_for_label }}" 
                                   class="form-control" required>
                            {% if field.help_text %}
                                <div class="form-text text-muted small" style="font-size: 0.75rem;">
                                    {{ field.help_text }}
                                </div>
                            {% endif %}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold rounded-3">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
